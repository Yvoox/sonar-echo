[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-echo-backend"
version = "0.1.0"
description = "Sonar-Echo — RAG Graph multi-tenant with temporal awareness"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",

    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",

    "neo4j==5.27.0",
    "qdrant-client==1.12.1",
    "redis==5.2.1",
    "arq==0.26.3",

    "boto3==1.35.85",
    "minio==7.2.12",

    "openai==1.58.1",
    "mistralai==1.2.5",
    "tiktoken==0.8.0",

    "httpx==0.27.2",
    "tenacity==9.0.0",
    "pypdf==5.1.0",
    "pdf2image==1.17.0",
    "pytesseract==0.3.13",
    "python-magic==0.4.27",
    "pillow==11.0.0",

    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",

    "mcp==1.1.3",
    "croniter==5.0.1",
    "email-validator==2.2.0",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
