# Single compose file. Behaviour branches on APP_ENV (dev | prod).
#
#   Dev   :  docker compose --profile dev up -d        # inclut MailHog
#   Prod  :  APP_ENV=prod docker compose up -d         # exclut les services dev
#
# La distinction est gérée :
#   - dans backend/entrypoint.sh (uvicorn --reload vs uvicorn --workers N)
#   - via les profiles Compose pour les services dev-only (mailhog)

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sonar_echo}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d ${POSTGRES_DB:-sonar_echo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me_too}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sonar}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Dev-only services (profile "dev") ─────────────────────────────
  # Mock SMTP server pour tester les automations email sans vrai SMTP.
  # UI accessible sur http://localhost:8025 quand profile dev actif.
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web
    profiles: ["dev"]

  # ─── Application ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    depends_on:
      postgres: { condition: service_healthy }
      neo4j:    { condition: service_healthy }
      qdrant:   { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Source mount : en dev permet le hot-reload via uvicorn --reload.
      # En prod : reflète le code déployé (git pull + docker compose restart backend).
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      postgres: { condition: service_healthy }
      neo4j:    { condition: service_healthy }
      qdrant:   { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    volumes:
      - ./backend/app:/app/app
    # Override entrypoint : les workers n'ont pas besoin du boot uvicorn
    entrypoint: []
    command: ["arq", "app.workers.arq_settings.WorkerSettings"]

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  qdrantdata:
  redisdata:
  miniodata:
